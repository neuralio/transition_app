agriculture:
  baseline_yields:
    MAIZE: 8.0
    WHEAT: 3.5
  crop_prices:
    MAIZE: 180.0
    WHEAT: 200.0
  land_hectares: 10.0
data:
  base_path: /app/data
  files:
    balance_sheet: ECB_BSI.csv
    biomass_potential: ENSPRESO_BIOMASS.xlsx
    dem: DEM.nc
    economic_accounts: EUROSTAT_aact_eaa01.tsv
    electricity_prices: EUROSTAT_nrg_pc_205.tsv
    employment: EUROSTAT_agr_r_employ.tsv
    env_protection_expenditure: EUROSTAT_env_ac_epneis.tsv
    env_tax_revenues: EUROSTAT_env_ac_tax.tsv
    env_taxes_by_activity: EUROSTAT_env_ac_taxind2.tsv
    fadn: FADN.csv
    farm_demographics: EUROSTAT_ef_m_farmang.tsv
    farm_indicators: EUROSTAT_ef_kvftaa.tsv
    farm_legal_status: EUROSTAT_ef_m_farmleg.tsv
    gdp: EUROSTAT_nama_10r_3gdp.tsv
    green_bonds: EUROSTAT_ sdg_13_70.tsv
    household_income: EUROSTAT_nama_10r_2hhinc.tsv
    interest_rates: EUROSTAT_ei_mfir_m.tsv
    lau_shapefile: LAU_RG_01M_2022_4326.shp/LAU_RG_01M_2022_4326.shp
    nuts_shapefile: NUTS_RG_01M_2021_4326.shp/NUTS_RG_01M_2021_4326.shp
    population: EUROSTAT_demo_r_pjanaggr3.tsv
    population_density: EUROSTAT_demo_r_d3dens.tsv
