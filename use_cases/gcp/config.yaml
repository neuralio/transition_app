    soil_cec: cec.nc
    soil_ph: ph.nc
    soil_type: soil_type.nc
    solar_potential: ENSPRESO_SOLAR_PV_CSP.XLSX
    solar_radiation: rsds_{scenario}.nc
    temperature: tas_{scenario}.nc
  subdirs:
    dem: dem
    geospatial: .
    meteo: meteo
    soil: soil
financial_institutions:
  feedback:
    market_adjustment_rate: 0.1
    policy_response_lag: 1
    risk_update_frequency: 2
  loan:
    default_interest_rate: 0.05
    max_loan_amount: 500000.0
    max_loan_term: 20
    min_loan_amount: 10000.0
  n_institutions: 2
  portfolio:
    max_exposure_per_sector: 0.3
    reserve_ratio: 0.1
    target_green_loan_percentage: 0.2
  risk_assessment:
    credit_score_threshold: 500
    debt_to_income_threshold: 0.45
    loan_to_value_threshold: 0.85
green_credit_policy:
  baseline:
    low_interest_loan_rate: 0.05
    pv_subsidy_rate: 0.0
    tax_incentive_rate: 0.0
  policy_adjustment:
    evaluation_period: 2
    max_adjustment_rate: 0.05
    target_adoption_rate: 0.3
  scenarios:
    high_support:
      low_interest_loan_rate: 0.01
      pv_subsidy_rate: 0.3
      tax_incentive_rate: 0.15
    low_support:
      low_interest_loan_rate: 0.03
      pv_subsidy_rate: 0.1
      tax_incentive_rate: 0.05
    moderate_support:
      low_interest_loan_rate: 0.02
      pv_subsidy_rate: 0.2
      tax_incentive_rate: 0.1
landowners:
  decision:
    environmental_weight: 0.2
    financial_weight: 0.5
    risk_weight: 0.17
    social_weight: 0.13
  financial_situation_distribution:
    moderate: 0.5
    poor: 0.2
    wealthy: 0.3
  risk_tolerance_distribution:
    high: 0.2
    low: 0.3
    moderate: 0.5
  social_influence:
    collective_pressure: 0.2
    information_diffusion_rate: 0.5
    peer_effect_strength: 0.3
logging:
  level: INFO
  log_file: logs/gcp_simulation.log
multilevel:
  enabled: true
  interactions:
    downward_influence: 0.6
    lateral_coordination: 0.4
    upward_aggregation: 0.8
  n_collectives: 2
  n_financial_institutions: 2
  n_policymakers: 1
output:
  enable_charts: true
  enable_feedback_loop_viz: true
  enable_gis_maps: true
  formats:
  - html
  - png
  - csv
  - json
  results_dir: results
region:
  lat_descending: true
  lat_max: 40.9
  lat_min: 40.4
  lon_max: 22.9
  lon_min: 22.5
  name: Thessaloniki, Greece
  nuts2_code: EL52
  nuts3_code: EL523
simulation:
  confidence_level: 0.95
  default_scenario: rcp45
  ensemble_size: 30
  n_landowners: 20
  n_years: 10
  scenario_descriptions:
    rcp26: "Optimistic (Low Warming ~2\xB0C)"
    rcp45: "Moderate (Medium Warming ~3\xB0C)"
    rcp85: "Pessimistic (High Warming ~4-5\xB0C)"
  scenario_mapping:
    moderate: rcp45
    optimistic: rcp26
    pessimistic: rcp85
solar_pv:
  annual_grid_fee: 500.0
  capacity_kw: 100.0
  degradation_rate: 0.005
  efficiency: 0.18
  electricity_price: 0.15
  feed_in_tariff: 0.12
  grid_connection_cost_per_km: 30000.0
  grid_connection_fee: 5000.0
  installation_cost_per_kw: 1000.0
  maintenance_cost_annual: 500
  project_lifetime: 25
  road_access_cost_per_km: 5000.0
